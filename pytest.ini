[pytest]
pythonpath = . src
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
xfail_strict = true
addopts = -p no:dotenv -ra --strict-markers
markers =
    unit: isolated tests without PostgreSQL, Redis or Celery workers
    integration: real PostgreSQL repositories and HTTP API
